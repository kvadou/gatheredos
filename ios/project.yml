name: GatheredOS
options:
  bundleIdPrefix: com.homeos
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "43"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: FM45AMFBNY
    CODE_SIGN_STYLE: Automatic
targets:
  GatheredOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GatheredOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dougkvamme.homeos
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan receipts and documents for your home's records."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Add provider-confirmed home service appointments to your calendar."
        INFOPLIST_KEY_CFBundleDisplayName: GatheredOS
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: Supabase
        product: Supabase
  # UI test bundle — the iOS pw-verify equivalent (headless screenshot sweep).
  GatheredOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GatheredOSUITests
    dependencies:
      - target: GatheredOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dougkvamme.homeos.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: GatheredOS
        TARGETED_DEVICE_FAMILY: "1,2"
# shared scheme — required by Xcode Cloud (headless CI never auto-creates schemes)
schemes:
  GatheredOS:
    build:
      targets:
        GatheredOS: all
        GatheredOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GatheredOSUITests
    archive:
      config: Release
